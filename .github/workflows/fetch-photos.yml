name: Fetch stock photos (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p photo-candidates
          for id in 8866740 8204396 7682211 8101449 8204315 7709172 8866755 8204312; do
            curl -sSL --fail -A "Mozilla/5.0" -o "photo-candidates/$id.jpg" "https://images.pexels.com/photos/$id/pexels-photo-$id.jpeg?auto=compress&cs=tinysrgb&w=2000" || echo "failed $id"
          done
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add photo-candidates && git commit -m "chore: photo candidates [static-build]" && git push
