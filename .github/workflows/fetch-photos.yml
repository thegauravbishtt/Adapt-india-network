name: Fetch stock photos (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p photo-candidates
          while read city ids; do
            for id in $ids; do
              curl -sSL --fail -A "Mozilla/5.0" -o "photo-candidates/$city-$id.jpg" "https://images.pexels.com/photos/$id/pexels-photo-$id.jpeg?auto=compress&cs=tinysrgb&w=2000" || echo "failed $city $id"
            done
          done <<'LIST'
          delhi 15210314 12931571 16960242
          gurgaon 37308276 16154229 7104646
          noida 15059576 2887207
          ghaziabad 37301163 34842268 29228894
          faridabad 37301162 36762987 29547311
          lucknow 33798556 37036588 30854654
          mumbai 33948766 39969973 37898660
          bengaluru 14845309 37695342 1276133
          hyderabad 4456656 12966707 11742758
          chennai 9432498 8572308 12903051
          pune 38296599 21835254 29285205
          kolkata 29484335 28737040 14279321
          ahmedabad 38319031 38319032 17391303
          jaipur 3581694 34649676 10454379
          chandigarh 33059588 4056400 31103717
          LIST
          ls photo-candidates | wc -l
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add photo-candidates && git commit -m "chore: photo candidates [static-build]" && git push
